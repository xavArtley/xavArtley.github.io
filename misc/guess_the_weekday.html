<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Guess the Weekday</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 20px;
      }
      nav {
        margin-bottom: 20px;
      }
      nav button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: 1px solid #ccc;
        background-color: #f0f0f0;
      }
      nav button.active {
        background-color: #007bff;
        color: white;
        border-color: #007bff;
      }
      select,
      button {
        margin: 10px;
        padding: 10px;
        font-size: 16px;
      }
      #speaker button{
        margin: 0;
        padding-top: 7px;
      }

      #hints {
        padding-top: 7px;
      }
      #result-view-view {
        margin-top: 20px;
        font-weight: bold;
      }
      #hints-view {
        margin-top: 20px;
      }
      #date {
        margin-top: 20px;
        font-size: 1.2em;
        font-weight: bold;
      }
      /* Style for the statistics view */
      #stats-view {
        display: none; /* Hidden by default */
        margin: 20px auto;
        max-width: 600px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
      }

      .hint-container {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 24px;
        max-width: 700px;
        margin: 20px auto;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        color: #374151;
      }

      /* Individual step styling */
      .hint-step {
        padding-bottom: 20px;
        margin-bottom: 20px;
        border-bottom: 1px solid #f3f4f6;
      }
      .hint-step:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      /* Step heading (e.g., "1. Century Anchor") */
      .hint-step h4 {
        display: flex;
        align-items: center;
        font-size: 1.1rem;
        font-weight: 600;
        color: #111827;
        margin: 0 0 12px 0;
      }

      /* The circular step number */
      .step-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        min-width: 28px;
        border-radius: 50%;
        background-color: #3b82f6; /* Accent color */
        color: #ffffff;
        font-size: 0.9rem;
        font-weight: 700;
        margin-right: 12px;
      }

      .step-content {
        padding-left: 40px; /* Aligns content with the heading text */
      }

      .step-content p {
        margin: 4px 0;
        line-height: 1.6;
        color: #4b5563;
      }

      /* Styling for inline code snippets */
      .step-content code {
        background-color: #f3f4f6;
        padding: 3px 6px;
        border-radius: 6px;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.9em;
        color: #1f2937;
      }

      /* Container for the side-by-side methods in Step 2 */
      .methods-comparison {
        display: flex;
        flex-wrap: wrap; /* Allows stacking on smaller screens */
        gap: 20px;
        margin: 12px 0;
      }

      .method {
        flex: 1;
        min-width: 250px; /* Prevents them from getting too squished */
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
        padding: 16px;
        border-radius: 8px;
      }

      .method h5 {
        margin: 0 0 10px 0;
        font-size: 1rem;
        font-weight: 600;
        color: #1f2937;
      }

      .method p {
        font-size: 0.9rem;
        margin: 2px 0;
      }

      /* Highlight for intermediate results */
      .step-result {
        margin-top: 16px !important;
        font-weight: 500;
        color: #1f2937;
      }

      /* Special highlight box for the final result */
      .final-result {
        margin-top: 16px;
        background-color: #eff6ff; /* Light blue background */
        border-left: 4px solid #3b82f6; /* Accent color border */
        padding: 12px 16px;
        border-radius: 0 8px 8px 0;
      }

      .final-result p {
        margin: 0;
        font-weight: 600;
        color: #1e3a8a; /* Darker blue text */
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <nav>
      <button id="btn-game" class="active" onclick="showView('game-view')">Game</button>
      <button id="btn-stats" onclick="showView('stats-view')">Statistics</button>
      <select id="mode">
        <option value="1">Text</option>
        <option value="2">Audio</option>
      </select>
    </nav>

    <div id="game-view">
      <h1>What day of the week is?</h1>
      <p id="date"></p>
      <p id="speaker"><button onclick="sayDate()">🔈</button></div></p>

      <select id="day">
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
        <option value="0">Sunday</option>
      </select>
      <br />
      <button onclick="verify()" id="validate">Validate</button>
      <button onclick="newDate()" id="new-date">New Date</button>
      <button onclick="showHints()" id="hints">💡</button>
      <div><p id="result-view"></p></div>
      <div><p id="hints-view">Hints</p></div>
    </div>

    <div id="stats-view">
      <h2>Statistics</h2>
      <button onclick="clearStats()">Clear Statistics</button>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Correct Day</th>
            <th>Success</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="stats-table-body"></tbody>
      </table>
    </div>

    <script>
      let currentDate;
      let tic;
      let toc;
      let attemptCount = 1;

      const weekDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const monthAnchors = { 1: 3, 2: 28, 3: 14, 4: 4, 5: 9, 6: 6, 7: 11, 8: 8, 9: 5, 10: 10, 11: 7, 12: 12 };

      const isLeap = (y) => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
      const mod7 = (n) => ((n % 7) + 7) % 7; // modulo 7 for both positive and negative integers
      function centuryAnchorFor(year) {
        const c = Math.floor(year / 100);
        const anchor = mod7(2 + 5 * (c % 4));
        return { c, anchor, anchorName: weekDays[anchor], k: c % 4 };
      }

      function conwayYearOffset(y) {
        const a = Math.floor(y / 12);
        const b = y % 12;
        const c = Math.floor(b / 4);
        const d = mod7(a + b + c);
        return { a, b, c, d };
      }

      function odd11YearOffset(y) {
        const start = y;
        const step1Odd = start % 2 !== 0;
        const s1 = step1Odd ? start + 11 : start;
        const h1 = s1 / 2; // guaranteed integer
        const step2Odd = h1 % 2 !== 0;
        const s2 = step2Odd ? h1 + 11 : h1;
        const r = mod7(s2); // remainder modulo 7
        const comp = mod7(7 - r); // 7's complement
        return { start, step1Odd, s1, h1, step2Odd, s2, r, comp };
      }

      function newDate() {
        attemptCount = 1; // Reset attempt counter
        mode = document.getElementById("mode").value;
        const year = 1600 + Math.floor(Math.random() * 501); // between 1600 and 2100
        const month = Math.floor(Math.random() * 12);
        // Correct way to get the number of days in the current month
        const maxDay = new Date(year, month + 1, 0).getDate();
        const day = Math.floor(Math.random() * maxDay) + 1;

        currentDate = new Date(year, month, day);
        if (mode == 1) {
          //text
          document.getElementById("date").hidden = false;
          document.getElementById("speaker").hidden = true;
          document.getElementById("date").textContent = currentDate.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
          tic = Date.now();
        } else if (mode == 2) {
          document.getElementById("date").hidden = true;
          document.getElementById("speaker").hidden = false;
        } else {
          console.error(`Unknown Mode ${mode}`);
        }
        document.getElementById("result-view").textContent = "";
        document.getElementById("hints-view").textContent = "";
        document.getElementById("validate").disabled = false;
      }

      function verify() {
        const selectedDay = document.getElementById("day").value;
        const realDay = currentDate.getDay();
        toc = Date.now();
        const elapsedTime = toc - tic;
        if (parseInt(selectedDay) === realDay) {
          document.getElementById("result-view").innerHTML = `✅ Correct !<br> Solution found in ${formatElapsedTime(
            elapsedTime
          )}.`;
          document.getElementById("result-view").style.color = "green";
          saveStat(elapsedTime, true);
        } else {
          document.getElementById("result-view").innerHTML = `❌ Wrong !<br> in ${formatElapsedTime(
            elapsedTime
          )}.`;
          document.getElementById("result-view").style.color = "red";
          saveStat(elapsedTime, false);
        }
        document.getElementById("validate").disabled = true;
      }

      function saveStat(time, correct) {
        // 1. Get existing stats from localStorage
        let stats = JSON.parse(localStorage.getItem("weekdayGameStats")) || [];

        // 2. Create the new entry
        const newStat = {
          recordDate: Date.now(),
          date: currentDate.toISOString(), // Standard format for the date
          correct: correct,
          time: time,
        };

        // 3. Add the new entry and save
        stats.push(newStat);
        localStorage.setItem("weekdayGameStats", JSON.stringify(stats));
      }

      function showStats() {
        const stats = JSON.parse(localStorage.getItem("weekdayGameStats")) || [];
        const tableBody = document.getElementById("stats-table-body");
        tableBody.innerHTML = ""; // Clear the table

        if (stats.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4">No statistics yet.</td></tr>';
          return;
        }

        // Reverse the array to show the most recent stats first
        stats.reverse().forEach((stat) => {
          const date = new Date(stat.date);
          const row = `
                    <tr>
                        <td>${date.toLocaleDateString("en-US")}</td>
                        <td>${weekDays[date.getDay()]}</td>
                        <td>${(stat.correct) ? "✅" : "❌"}</td>
                        <td>${formatElapsedTime(stat.time)}</td>
                    </tr>
                `;
          tableBody.innerHTML += row;
        });
      }

      function clearStats() {
        if (confirm("Are you sure you want to clear all statistics?")) {
          localStorage.removeItem("weekdayGameStats");
          showStats(); // Update the display
        }
      }

      function showView(viewId) {
        document.getElementById("game-view").style.display = "none";
        document.getElementById("stats-view").style.display = "none";
        document.getElementById(viewId).style.display = "block";

        document.getElementById("btn-game").classList.remove("active");
        document.getElementById("btn-stats").classList.remove("active");

        if (viewId === "game-view") {
          document.getElementById("btn-game").classList.add("active");
        } else {
          document.getElementById("btn-stats").classList.add("active");
          showStats(); // Refresh stats when switching to the tab
        }
      }

      function showHints() {
        const hintsView = document.getElementById("hints-view");
        const day = currentDate.getDate();
        const month = currentDate.getMonth() + 1;
        const year = currentDate.getFullYear();

        // Century anchor
        const { c, anchor, anchorName, k } = centuryAnchorFor(year);

        // Year offset via both methods (we will highlight the chosen one)
        const y = year % 100;
        const con = conwayYearOffset(y);
        const odd = odd11YearOffset(y);
        console.assert(con.d == odd.comp, "Both methods not yield to the same value");
        const centuryOffet = con.d;

        // Month anchor
        let monthAnchor = monthAnchors[month];
        const leap = isLeap(year);
        const before = monthAnchor;
        if (leap && (month === 1 || month === 2)) monthAnchor += 1; // Jan/Feb shift in leap years
        const delta = day - monthAnchor;
        const deltaMod = mod7(delta);
        const weekday = mod7(anchor + centuryOffet + deltaMod);

        hintsView.innerHTML = `
<div class="hint-container">
  <div class="hint-step">
    <h3>Date: ${currentDate.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}</h3>
    <h4><span class="step-number">1</span>Century Anchor → ${anchor}</h4>
    <div class="step-content">Century <code>c = ${c}</code>; compute <code>k = c mod 4 = ${k}</code>.</div>
    <div class="step-content">
      Anchor formula: <code>(2 + 5×k) mod 7 = (2 + 5×${k}) mod 7 = ${2 + 5 * k} mod 7 → ${anchor}</code>.
    </div>
  </div>

  <div class="hint-step">
    <h4><span class="step-number">2</span>Year Offset Inside the Century → ${centuryOffet}</h4>
    <div class="step-content">
      <div class="methods-comparison">
        <div class="method">
          <h5>2A. Conway's original method</h5>
          <p><code>a = ⌊y/12⌋ = ⌊${y}/12⌋ = ${con.a}</code></p>
          <p><code>b = y mod 12 = ${y} mod 12 = ${con.b}</code></p>
          <p><code>c = ⌊b/4⌋ = ⌊${con.b}/4⌋ = ${con.c}</code></p>
          <p>
            <code
              >d = (a + b + c) mod 7 = (${con.a} + ${con.b} + ${con.c}) mod 7 = ${con.a + con.b + con.c} mod 7
              → ${con.d}</code
            >
          </p>
        </div>
        <div class="method">
          <h5>2B. Odd+11 method</h5>
          <p>
            Start <code>y = ${odd.start}</code>${odd.step1Odd ? " (odd)" : " (even)"}${
          odd.step1Odd
            ? ` → add 11 →
            <code>${odd.s1}</code>`
            : ""
        }
          </p>
          <p>
            Halve → <code>${odd.s1}/2 = ${odd.h1}</code>${odd.step2Odd ? " (odd)" : " (even)"}${
          odd.step2Odd
            ? ` → add
            11 → <code>${odd.s2}</code>`
            : ""
        }
          </p>
          <p>
            Reduce modulo 7: <code>${odd.s2} mod 7 = ${odd.r}</code>; take 7's complement:
            <code>7 - ${odd.r} = ${7 - odd.r} → ${odd.comp}</code>
          </p>
        </div>
      </div>
    </div>
  </div>
  <div class="hint-step">
    <h4><span class="step-number">3</span>Days offset from monthly anchor -> ${deltaMod}</h4>
    <div class="step-content">
      Base anchor for month ${month} = <code>${before}</code>${month === 1 || month === 2 ? " (Jan/Feb)" : ""}.
    </div>
    <div class="step-content">
      ${leap ? "Leap year detected" : "Common year"} → ${
          leap && (month === 1 || month === 2)
            ? `add 1 →
      <code>${monthAnchor}</code> (because Jan 4 / Feb 29 in leap years).`
            : `no shift → <code>${monthAnchor}</code>.`
        }
    </div>
    <div class="step-content">
      Difference: <code>Δ = day − monthAnchor = ${day} − ${monthAnchor} = ${day - monthAnchor}</code>.
    </div>
    <div class="step-content">Normalize modulo 7: <code>Δ mod 7 = ${day - monthAnchor} mod 7 = ${deltaMod}</code>.</div>
  </div>
  <div class="hint-step">
    <h4><span class="step-number">4</span>Deduce weekday from previous steps -> ${weekDays[weekday]}</h4>
    <div class="step-content">
        <code>(${anchor} + ${centuryOffet} + ${deltaMod}) mod 7 = ${
          anchor + centuryOffet + deltaMod
        } mod 7 = ${weekday} -> ${weekDays[weekday]}</code>
    </div>
</div>
            `;
      }

      function formatElapsedTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return `${hours > 0 ? hours.toString().padStart(2, "0") + "h:" : ""}${
          minutes > 0 ? minutes.toString().padStart(2, "0") + "min:" : ""
        }${seconds.toString().padStart(2, "0") + "s"}`;
      }

      function sayDate() {
        const options = { year: "numeric", month: "long", day: "numeric" };
        const dateToSay = currentDate.toLocaleDateString("en-US", options);

        // Vérifie si l'API de synthèse vocale est supportée par le navigateur
        if ("speechSynthesis" in window) {
          const utterance = new SpeechSynthesisUtterance(dateToSay);
          utterance.onend = () => (tic = Date.now());
          utterance.lang = "en-US"; // Définit la langue pour une prononciation correcte
          speechSynthesis.speak(utterance);
        } else {
          console.error("L'API de synthèse vocale n'est pas supportée par ce navigateur.");
        }
      }

      // Initial setup on page load
      window.onload = function () {
        showView("game-view");
        newDate();
      };
    </script>
  </body>
</html>
